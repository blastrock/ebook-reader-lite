name: CI
on: [push, pull_request]
jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.3.4
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.21.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Postinstall steps
        run: pnpm svelte-kit sync
        working-directory: apps/web

      - name: Lint
        run: pnpm eslint .

      - name: Test build
        run: pnpm build

      # Only Chromium: the app's WebView is Chromium.
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium
        working-directory: apps/web

      # The reader uses the system's fonts, and Android renders Japanese with Noto CJK.
      # Playwright's WenQuanYi Zen Hei and IPA Gothic take precedence over it, and the
      # former lays some kanji out with no height in vertical text, which breaks taps.
      - name: Use Noto CJK for Japanese
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          sudo apt-get remove -y fonts-wqy-zenhei fonts-ipafont-gothic

      - name: End-to-end tests
        run: pnpm test:e2e
        working-directory: apps/web

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 14
